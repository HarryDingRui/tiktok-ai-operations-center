upstream auth_gateway {
    server auth-gateway:8789;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    include /etc/nginx/mime.types;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location = /healthz {
        access_log off;
        auth_basic off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # The login surface must be reachable before a session exists.
    location = /login {
        try_files /login.html =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* ^/login\.(?:html|css|js)$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /api/auth/login {
        proxy_pass http://auth_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/logout {
        proxy_pass http://auth_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/auth/session {
        proxy_pass http://auth_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Nginx asks the internal auth service whether the browser session is valid.
    location = /__auth_verify {
        internal;
        proxy_pass http://auth_gateway/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # index.html controls the current asset versions and must be revalidated
    # after every git pull and image rebuild.
    location = /index.html {
        auth_request /__auth_verify;
        error_page 401 = @login_redirect;
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Keep browser caching for static resources while forcing a lightweight
    # validation window so a new internal image becomes visible promptly.
    location ~* \.(?:css|js|mjs|json)$ {
        auth_request /__auth_verify;
        error_page 401 = @login_redirect;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(?:ico|gif|jpe?g|png|webp|svg|woff2?|ttf|otf|xlsx|xls|csv)$ {
        auth_request /__auth_verify;
        error_page 401 = @login_redirect;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # The current site switches page panels in JavaScript rather than using a
    # client-side router. This fallback is harmless today and keeps direct
    # navigation compatible if a router is introduced later.
    location / {
        auth_request /__auth_verify;
        error_page 401 = @login_redirect;
        try_files $uri $uri/ /index.html;
    }

    location @login_redirect {
        return 302 /login?next=$request_uri;
    }
}
