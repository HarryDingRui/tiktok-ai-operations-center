server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    auth_basic "TikTok AI Operations Center";
    auth_basic_user_file /etc/nginx/.htpasswd;

    include /etc/nginx/mime.types;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location = /healthz {
        access_log off;
        auth_basic off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # index.html controls the current asset versions and must be revalidated
    # after every git pull and image rebuild.
    location = /index.html {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Keep browser caching for static resources while forcing a lightweight
    # validation window so a new internal image becomes visible promptly.
    location ~* \.(?:css|js|mjs|json)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(?:ico|gif|jpe?g|png|webp|svg|woff2?|ttf|otf|xlsx|xls|csv)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # The current site switches page panels in JavaScript rather than using a
    # client-side router. This fallback is harmless today and keeps direct
    # navigation compatible if a router is introduced later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
