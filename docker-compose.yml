services:
  tiktok-ai-operations-center:
    build:
      context: .
      dockerfile: Dockerfile
    image: tiktok-ai-operations-center:local
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Provision this server-only file with htpasswd; never commit it.
      - ./.secrets/htpasswd:/etc/nginx/.htpasswd:ro
