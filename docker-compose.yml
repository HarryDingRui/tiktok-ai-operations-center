services:
  auth-gateway:
    build:
      context: ./services/auth-gateway
      dockerfile: Dockerfile
    image: tiktok-ai-operations-center-auth:local
    restart: unless-stopped
    environment:
      AUTH_CONFIG_FILE: /run/secrets/auth-config.json
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:-28800}"
    volumes:
      # Provision this server-only file with the interactive auth-config script; never commit it.
      - ./.secrets/auth-config.json:/run/secrets/auth-config.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  tiktok-ai-operations-center:
    build:
      context: .
      dockerfile: Dockerfile
    image: tiktok-ai-operations-center:local
    restart: unless-stopped
    depends_on:
      auth-gateway:
        condition: service_healthy
    ports:
      - "8080:80"
